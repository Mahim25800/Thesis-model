# Scaled 40,000+ Image Physics Deepfake Pipeline Configuration

data:
  raw_dir: "data/scaled"
  cache_dir: "data/cache_scaled"
  shards_dir: "data/cache_scaled/shards"
  train_real_count: 16000
  train_fake_count: 16000
  test_real_count: 4000
  test_fake_count: 4000
  total_samples: 40000
  shard_size: 2000
  image_size: [256, 256]

extractors:
  batch_size: 64
  feature_dim: 14
  confidence_dim: 4
  cache_schema: "deterministic_14d_v2_for_future_extraction"
  surface_normals:
    backend: "dsine"
    checkpoint: "models/normal_estimators/dsine/exp002_kappa/dsine.pt"
    checkpoint_sha256: "1BDDAE86D7D8F59912C50F3164C2543B1B80FDADFBF1C5DD0AB2D85108BBA955"
    approximate_fov_degrees: 60
    method: "trained_uncertainty_aware_DSINE_v02_kappa"

model:
  module_dims: [5, 4, 3, 2]
  feature_dim: 14
  confidence_dim: 4
  use_mask_tokens: true
  include_confidences: true
  dropout: 0.2
  promoted_artifact: "models/multi_entity_v3/model.pt"
  promoted_input_scope: "audited_legacy_cache_only"

training:
  batch_size: 256
  epochs: 40
  lr: 0.0005 # 5e-4
  weight_decay: 0.001 # 1e-3
  eta_min: 0.000001 # 1e-6 (CosineAnnealingLR)
  seed: 42
  best_checkpoint: "models/gated_cross_gen_40k_best.pt"
  checkpoint_dir: "models/checkpoints"
